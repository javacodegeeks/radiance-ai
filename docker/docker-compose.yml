version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cosmetic_rai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
      image: mongo:7
      environment:
        MONGO_INITDB_DATABASE: obf
        MONGO_INITDB_ROOT_USERNAME: mongo
        MONGO_INITDB_ROOT_PASSWORD: mongo
      ports:
        - '27017:27017'
      volumes:
        - mongodb_data:/data/db
      healthcheck:
        test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
        interval: 5s
        timeout: 5s
        retries: 5

  qdrant:
      image: qdrant/qdrant:latest
      ports:
        - '6333:6333'    # HTTP API
        - '6334:6334'    # gRPC
      volumes:
        - qdrant_data:/qdrant/storage
      healthcheck:
        test: ['CMD', 'true'] # Qdrant doesn't have a built-in health check, so we use a simple command that always returns true. In production, you might want to implement a more robust check.
        interval: 5s
        timeout: 5s
        retries: 5

  litellm:
      image: ghcr.io/berriai/litellm:main-latest
      environment:
        OPENAI_API_KEY: ${OPENAI_API_KEY}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        XAI_API_KEY: ${XAI_API_KEY}
        GROQ_API_KEY: ${GROQ_API_KEY}
      ports:
        - '4000:4000'
      volumes:
        - ./litellm-config.yaml:/app/config.yaml
      command: ['--config', '/app/config.yaml', '--port', '4000']
      depends_on:
        postgres:
          condition: service_healthy
        mongodb:
          condition: service_healthy  
        qdrant:
          condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
  qdrant_data:
