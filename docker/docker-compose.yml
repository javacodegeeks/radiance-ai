services:
  postgres:
    image: 'pgvector/pgvector:pg16'
    environment:
      POSTGRES_DB: cosmetic_rai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
  mongodb:
    image: 'mongo:7'
    environment:
      MONGO_INITDB_DATABASE: obf
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - '27017:27017'
    volumes:
      - 'mongodb_data:/data/db'
    healthcheck:
      test:
        - CMD
        - mongosh
        - '--eval'
        - 'db.runCommand({ ping: 1 })'
      interval: 5s
      timeout: 5s
      retries: 5
  qdrant:
    image: 'qdrant/qdrant:v1.18.2'
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - 'qdrant_data:/qdrant/storage'
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  litellm:
    image: 'ghcr.io/berriai/litellm:1.87.1'
    environment:
      OPENAI_API_KEY: some_key
      ANTHROPIC_API_KEY: some_key
      GEMINI_API_KEY: some_key
      XAI_API_KEY: some_key
      GROQ_API_KEY: some_key
    ports:
      - '4000:4000'
    volumes:
      - './litellm-config.yaml:/app/config.yaml'
    command:
      - '--config'
      - /app/config.yaml
      - '--port'
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
  mongodb_data: null
  qdrant_data: null
