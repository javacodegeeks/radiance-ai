name: PR Tests

on:
  pull_request:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: read

jobs:
  lint-ai:
    name: AI Layer Lint
    uses: ./.github/workflows/reusable-lint.yml
    with:
      package-dir: ai
      install-flags: --legacy-peer-deps

  lint-data:
    name: Data Layer Lint
    uses: ./.github/workflows/reusable-lint.yml
    with:
      package-dir: data

  test-ai:
    name: AI Layer Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      package-dir: ai
      install-flags: --legacy-peer-deps
      artifact-name: ai-coverage

  test-data:
    name: Data Layer Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      package-dir: data
      artifact-name: data-coverage

  comment-coverage:
    name: Post Coverage Comment
    runs-on: ubuntu-latest
    needs: [lint-ai, lint-data, test-ai, test-data]
    if: always()
    steps:
      - name: Download AI coverage
        uses: actions/download-artifact@v4
        with:
          name: ai-coverage
          path: ai-coverage
        continue-on-error: true

      - name: Download Data coverage
        uses: actions/download-artifact@v4
        with:
          name: data-coverage
          path: data-coverage
        continue-on-error: true

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const status = (result) => result === 'success' ? 'Passed' : result === 'failure' ? 'Failed' : 'Skipped';

            const lintAi   = '${{ needs.lint-ai.result }}';
            const lintData = '${{ needs.lint-data.result }}';
            const testAi   = '${{ needs.test-ai.result }}';
            const testData = '${{ needs.test-data.result }}';

            const lintSection = [
              '## Lint',
              `| Package | Status |`,
              `|---------|--------|`,
              `| AI Layer (\`/ai\`) | ${status(lintAi)} |`,
              `| Data Layer (\`/data\`) | ${status(lintData)} |`,
            ].join('\n');

            function parseCoverage(filePath, label, testResult) {
              if (testResult !== 'success') {
                return `### ${label}\n_Tests ${testResult} — coverage not available_`;
              }
              try {
                const summary = JSON.parse(fs.readFileSync(filePath, 'utf8')).total;
                const fmt = (m) => `${m.covered}/${m.total} (${m.pct}%)`;
                return [
                  `### ${label}`,
                  `| Metric | Coverage |`,
                  `|--------|----------|`,
                  `| Lines | ${fmt(summary.lines)} |`,
                  `| Statements | ${fmt(summary.statements)} |`,
                  `| Functions | ${fmt(summary.functions)} |`,
                  `| Branches | ${fmt(summary.branches)} |`,
                ].join('\n');
              } catch {
                return `### ${label}\n_Coverage report not available_`;
              }
            }

            const aiReport   = parseCoverage('ai-coverage/coverage-summary.json',   'AI Layer (`/ai`)',   testAi);
            const dataReport = parseCoverage('data-coverage/coverage-summary.json', 'Data Layer (`/data`)', testData);

            const body = [
              '## CI Report',
              '',
              lintSection,
              '',
              '## Test Coverage',
              '',
              aiReport,
              '',
              dataReport,
              '',
              `_Generated for commit ${context.sha.slice(0, 7)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CI Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
