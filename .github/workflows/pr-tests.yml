name: PR Tests

on:
  pull_request:
    branches:
      - dev

permissions:
  pull-requests: write
  contents: read

jobs:
  test-ai:
    name: AI Layer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=json-summary text

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-coverage
          path: ai/coverage/coverage-summary.json

  test-data:
    name: Data Layer Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=json-summary text

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-coverage
          path: data/coverage/coverage-summary.json

  comment-coverage:
    name: Post Coverage Comment
    runs-on: ubuntu-latest
    needs: [test-ai, test-data]
    if: always()
    steps:
      - name: Download AI coverage
        uses: actions/download-artifact@v4
        with:
          name: ai-coverage
          path: ai-coverage
        continue-on-error: true

      - name: Download Data coverage
        uses: actions/download-artifact@v4
        with:
          name: data-coverage
          path: data-coverage
        continue-on-error: true

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function parseCoverage(filePath, label) {
              try {
                const summary = JSON.parse(fs.readFileSync(filePath, 'utf8')).total;
                const fmt = (m) => `${m.covered}/${m.total} (${m.pct}%)`;
                return [
                  `### ${label}`,
                  `| Metric | Coverage |`,
                  `|--------|----------|`,
                  `| Lines | ${fmt(summary.lines)} |`,
                  `| Statements | ${fmt(summary.statements)} |`,
                  `| Functions | ${fmt(summary.functions)} |`,
                  `| Branches | ${fmt(summary.branches)} |`,
                ].join('\n');
              } catch {
                return `### ${label}\n_Coverage report not available_`;
              }
            }

            const aiReport   = parseCoverage('ai-coverage/coverage-summary.json',   'AI Layer (`/ai`)');
            const dataReport = parseCoverage('data-coverage/coverage-summary.json', 'Data Layer (`/data`)');

            const body = [
              '## Test Coverage Report',
              '',
              aiReport,
              '',
              dataReport,
              '',
              `_Generated for commit ${context.sha.slice(0, 7)}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Test Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
