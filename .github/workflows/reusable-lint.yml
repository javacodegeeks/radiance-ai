name: Reusable Lint

on:
  workflow_call:
    inputs:
      package-dir:
        description: Package directory to lint (e.g. ai, data)
        required: true
        type: string
      install-flags:
        description: Extra flags for npm install
        required: false
        type: string
        default: ''
      artifact-name:
        description: Name for the uploaded lint output artifact
        required: true
        type: string

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install ${{ inputs.install-flags }}
        working-directory: ${{ inputs.package-dir }}

      - name: Run lint
        id: lint
        run: |
          npm run lint 2>&1 | tee lint-output.txt
          exit ${PIPESTATUS[0]}
        working-directory: ${{ inputs.package-dir }}
        continue-on-error: true

      - name: Upload lint output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.package-dir }}/lint-output.txt

      - name: Fail job if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
